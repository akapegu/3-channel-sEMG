<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">Four-session gesture recognition and tilt false-command results</title>
<desc id="desc">Grouped panels show gesture-cue accuracy and the percentage of relaxed-finger tilt controls falsely classified as a command for four held-out wearings. Session 4 accuracy fell and false commands rose.</desc>
<rect width="1120" height="570" fill="#FFFFFF"/>
<text x="560.0" y="34.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#20313D">Four-gesture performance changes after re-wearing</text>
<text x="560.0" y="61.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#5C6C76">Fixed 400 ms Extra Trees + EMG/accelerometer features; each event is one prompted cue</text>
<text x="323.5" y="100.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#20313D">Gesture cues classified correctly</text>
