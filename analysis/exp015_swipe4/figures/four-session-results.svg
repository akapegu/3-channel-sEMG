<text x="560.0" y="518.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#5C6C76">S4: one locked evaluation using the model trained on S1–S3; this test is now consumed.</text>
<text x="560.0" y="540.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#5C6C76">Each session: 80 gesture cues and 40 relaxed-finger tilt controls. Not a live-latency or daily false-command test.</text>
